include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    # Hasil generator: build_runner (freezed, json_serializable, drift) dan gen-l10n.
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - lib/core/l10n/generated/**
  errors:
    # json_serializable membaca @JsonKey di parameter konstruktor freezed.
    invalid_annotation_target: ignore

linter:
  rules:
    prefer_single_quotes: true
    require_trailing_commas: true
    unawaited_futures: true

formatter:
  page_width: 120
