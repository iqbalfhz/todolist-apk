name: todolist
description: "Denly Days, app to-do untuk berdua: tugas, tabungan, liburan, dan kenangan."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI
  material_ui: ^1.6.0
  material_symbols_icons: ^4.2960.0
  fl_chart: ^1.2.0
  cached_network_image: ^4.0.4

  # State dan routing
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2

  # Jaringan dan data lokal
  dio: ^5.11.1
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  flutter_secure_storage: ^11.2.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # Notifikasi
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^22.3.1

  # Foto profil
  image_picker: ^1.2.4
  image_cropper: ^12.2.1
  flutter_image_compress: ^2.5.1

  # Lain-lain
  share_plus: ^13.3.1
  intl: any
  flutter_timezone: ^5.1.1
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.2
  drift_dev: ^2.35.1
  freezed: ^4.0.2
  json_serializable: ^6.14.1
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true

  fonts:
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
